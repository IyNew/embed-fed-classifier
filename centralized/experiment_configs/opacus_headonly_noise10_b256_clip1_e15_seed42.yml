# Head-only DP fine-tuning baseline: noise=1.0, delta=1e-5, batch=256, clip=1.0, 15 epochs.
data_csv: "/home/wenytang/FL_projects/embed_data_full/data_handling_auto/model_data/first_model_trainig.csv"
cleaned_data_root: "/mnt/c/Data/EMBED/embed_cleaned"
workdir: "./centralized_runs/opacus_headonly_noise10_b256_clip1_e15_seed42"

splits:
  train: "train"
  validation: "validation"
  test: "test"

seed: 42
dataset: "Dataset"
cache_rate: 1

dataloader:
  batch_size: 256
  num_workers: 2
  shuffle: true
  pin_memory: true
  read_retries: 3
  retry_delay_seconds: 0.25

epochs: 15
val_interval: 1
save_metric: "balanced_accuracy"

differential_privacy:
  enabled: true
  accountant: "prv"
  secure_mode: false
  mode: "noise_multiplier"
  noise_multiplier: 1.0
  target_delta: 0.00001
  max_grad_norm: 1.0
  poisson_sampling: true
  clipping: "flat"
  grad_sample_mode: "hooks"
  fix_modules: true

optimizer:
  name: "SGD"
  freeze_backbone: true
  lr_backbone: 0.0
  lr_finetune: 0.0001
  momentum: 0.0
  weight_decay: 0.00005

loss:
  name: "CrossEntropyLoss"
  label_smoothing: 0.0
  class_weights: false

model:
  name: "ConvNeXtTiny"
  num_classes: 2
  pretrained: true
  dropout: 0.5

train_transforms:
  LoadImaged_im:
    keys: ["image"]
    ensure_channel_first: true
  ScaleIntensityd:
    keys: ["image"]
  Orientationd:
    keys: ["image"]
    axcodes: "RAS"
    as_closest_canonical: true
  ResizeWithPadOrCropd:
    keys: ["image"]
    spatial_size: [256, 256]
  RandFlipd_x:
    keys: ["image"]
    prob: 0.2
    spatial_axis: 0
  RandFlipd_y:
    keys: ["image"]
    prob: 0.2
    spatial_axis: 1
  RandRotated:
    keys: ["image"]
    prob: 0.2
    range_x: [-0.8, 0.8]
    range_y: [-0.8, 0.8]
    mode: "bilinear"
  RandAffined:
    keys: ["image"]
    prob: 0.2
    rotate_range: [0.2]
    scale_range: [0.2]
    mode: "bilinear"

eval_transforms:
  LoadImaged_im:
    keys: ["image"]
    ensure_channel_first: true
  ScaleIntensityd:
    keys: ["image"]
  Orientationd:
    keys: ["image"]
    axcodes: "RAS"
    as_closest_canonical: true
  ResizeWithPadOrCropd:
    keys: ["image"]
    spatial_size: [256, 256]
