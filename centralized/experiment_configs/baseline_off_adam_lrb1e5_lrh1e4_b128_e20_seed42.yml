# Non-DP baseline: Adam, batch=128, lr_backbone=1e-5, lr_finetune=1e-4.
# Keeps the DP candidate's model/loss/transform regime but disables privacy.
data_csv: "/home/wenytang/FL_projects/embed_data_full/data_handling_auto/model_data/first_model_trainig.csv"
cleaned_data_root: "/mnt/c/Data/EMBED/embed_cleaned"
workdir: "./centralized_runs/baseline_off_adam_lrb1e5_lrh1e4_b128_e20_seed42"

splits:
  train: "train"
  validation: "validation"
  test: "test"

seed: 42
dataset: "Dataset"
cache_rate: 1

dataloader:
  batch_size: 128
  num_workers: 10
  shuffle: true
  pin_memory: true

epochs: 20
val_interval: 1
save_metric: "balanced_accuracy"

differential_privacy:
  enabled: false
  accountant: "prv"
  secure_mode: false
  mode: "noise_multiplier"
  noise_multiplier: 0.5
  target_epsilon: null
  target_delta: 0.00025886616515661404
  max_grad_norm: 5.0
  poisson_sampling: true
  clipping: "flat"
  grad_sample_mode: "hooks"
  fix_modules: true

optimizer:
  name: "Adam"
  lr_backbone: 0.00001
  lr_finetune: 0.0001
  betas: [0.9, 0.999]
  epsilon: 0.00000008
  weight_decay: 0.00005

loss:
  name: "CrossEntropyLoss"
  label_smoothing: 0.1
  class_weights: true

model:
  name: "ConvNeXtTiny"
  num_classes: 2
  pretrained: true
  dropout: 0.5

train_transforms:
  LoadImaged_im:
    keys: ["image"]
    ensure_channel_first: true
  ScaleIntensityd:
    keys: ["image"]
  Orientationd:
    keys: ["image"]
    axcodes: "RAS"
    as_closest_canonical: true
  ResizeWithPadOrCropd:
    keys: ["image"]
    spatial_size: [256, 256]
  RandFlipd_x:
    keys: ["image"]
    prob: 0.2
    spatial_axis: 0
  RandFlipd_y:
    keys: ["image"]
    prob: 0.2
    spatial_axis: 1
  RandRotated:
    keys: ["image"]
    prob: 0.2
    range_x: [-0.8, 0.8]
    range_y: [-0.8, 0.8]
    mode: "bilinear"
  RandAffined:
    keys: ["image"]
    prob: 0.2
    rotate_range: [0.2]
    scale_range: [0.2]
    mode: "bilinear"

eval_transforms:
  LoadImaged_im:
    keys: ["image"]
    ensure_channel_first: true
  ScaleIntensityd:
    keys: ["image"]
  Orientationd:
    keys: ["image"]
    axcodes: "RAS"
    as_closest_canonical: true
  ResizeWithPadOrCropd:
    keys: ["image"]
    spatial_size: [256, 256]
